[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    security: marks tests as security-critical (run these first in CI)
    integration: marks tests as requiring external services (DB, Redis, ChromaDB)

