# nginx.conf
# Nginx reverse proxy for Pillara on Contabo VPS
# Place at: /etc/nginx/sites-available/pillara
# Enable with: ln -s /etc/nginx/sites-available/pillara /etc/nginx/sites-enabled/

# ─── RATE LIMITING ──────────────────────────────────────────────────────────
# First line of defence — per-IP rate limiting at the Nginx level
# before requests even reach FastAPI
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=10r/m;

# ─── HTTP → HTTPS REDIRECT ──────────────────────────────────────────────────
server {
    listen 80;
    server_name api.pillara.site;
    return 301 https://$host$request_uri;
}

# ─── HTTPS API SERVER ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api.pillara.site;

    # ── SSL (Certbot manages these) ──────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/api.pillara.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pillara.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Request size limit ───────────────────────────────────────────────────
    client_max_body_size 10m;

    # ── Timeouts ─────────────────────────────────────────────────────────────
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;  # LLM calls can take up to 30s — give headroom

    # ── Auth endpoints — strict rate limiting ────────────────────────────────
    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password) {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── AI endpoints — moderate rate limiting (expensive) ───────────────────
    location ~ ^/api/v1/(ai|interactions) {
        limit_req zone=ai_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── All other API endpoints ──────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health check — no rate limit (for monitoring) ────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Block common attack paths ────────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}