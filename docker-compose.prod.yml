# docker-compose.prod.yml
# Staging/production overlay. Do NOT run by hand with plain `docker compose` —
# use deploy.sh, which sets everything this file needs:
#
#   DEPLOY_ENV  staging | production   → picks .env.staging / .env.production
#   IMAGE_TAG   git commit SHA          → which prebuilt image to run
#
# Adds the FastAPI backend and ARQ worker to the base infrastructure.
#
# SECURITY NOTES:
# - `ports: !reset []` truly removes a port. A plain `ports: []` does NOT —
#   Compose merges port lists, so the base ports would stay published.
#   (`!reset` needs Docker Compose v2.24.4+; check with `docker compose version`.)
# - The API listens on 127.0.0.1 only. Nginx is the only way in from outside.
# - ENVIRONMENT is NOT set here — it comes from the env file / Infisical,
#   so staging can never believe it is production.

services:

  # ─── FASTAPI BACKEND ────────────────────────────────────────────────────────
  api:
    image: ghcr.io/chinelonweke/pillara:${IMAGE_TAG:?IMAGE_TAG must be set}
    env_file:
      - .env.${DEPLOY_ENV:?DEPLOY_ENV must be set}
    environment:
      # In-container addresses — the same for every environment
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    restart: always
    volumes:
      - /tmp/pillara_reports_${DEPLOY_ENV}:/tmp/reports
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── ARQ BACKGROUND WORKER ──────────────────────────────────────────────────
  worker:
    image: ghcr.io/chinelonweke/pillara:${IMAGE_TAG:?IMAGE_TAG must be set}
    command: ["arq", "workers.worker.WorkerSettings"]
    env_file:
      - .env.${DEPLOY_ENV:?DEPLOY_ENV must be set}
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ─── INFRASTRUCTURE: remove host ports ──────────────────────────────────────
  # Redis and ChromaDB are only used by api/worker over the internal network.
  redis:
    ports: !reset []

  chromadb:
    ports: !reset []

  # Prometheus and Grafana keep a 127.0.0.1-only port (from the base file) so
  # you can reach them through an SSH tunnel. They are never public.
  #   ssh -L 3001:localhost:3001 deploy@<vps-ip>   → http://localhost:3001

# ─── NETWORK ──────────────────────────────────────────────────────────────────
# Fixed subnet so the gateway IP is predictable. Nginx on the host reaches the
# API through this gateway, so TRUSTED_PROXY_IPS must include it:
#   default subnet 172.30.0.0/24  →  TRUSTED_PROXY_IPS=127.0.0.1,172.30.0.1
networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.0.0/24}