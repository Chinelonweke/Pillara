name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    name: Backend - lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff lint check
        run: ruff check . --exclude .venv

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://pillara:pillara@localhost:5432/pillara
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-test-secret-key-that-is-long-enough-32chars
          GROQ_API_KEY: test-key
          ENVIRONMENT: development
          DEBUG: "false"
          USE_INFISICAL: "false"
        run: pytest tests/unit -q --tb=short

  docker:
    name: Docker - build check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build . --tag pillara:ci

  frontend:
    name: Frontend - lint + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: pillara-web/package-lock.json

      - name: Install dependencies
        working-directory: pillara-web
        run: npm ci

      - name: Lint check
        working-directory: pillara-web
        run: npm run lint

      - name: Production build
        working-directory: pillara-web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.pillara.site
