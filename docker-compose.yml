# docker-compose.yml
# Development: only infrastructure runs in Docker (Redis, ChromaDB, Prometheus, Grafana)
# Production/staging: add docker-compose.prod.yml on top (see that file)
#
# SECURITY: every port is bound to 127.0.0.1 (this machine only).
# "6380:6379" would listen on ALL interfaces — on a server that means the
# public internet, and Docker bypasses the UFW firewall.
#
# No container_name / fixed network name: Compose names things per project
# (e.g. pillara-production-redis-1), so staging and production can never
# share containers or a network.

services:

  # ─── REDIS ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6380:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─── CHROMADB ───────────────────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.20
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # ─── PROMETHEUS ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest   # TODO: pin a version
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped

  # ─── GRAFANA ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest   # TODO: pin a version
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis_data:
  chromadb_data:
  prometheus_data:
  grafana_data: